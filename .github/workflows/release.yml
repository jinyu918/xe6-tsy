name: Backend Release

run-name: >-
  ${{
    github.ref_type == 'tag'
      && format('Release {0}', github.ref_name)
      || 'Tip Build'
  }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  verify-go:
    name: Verify Go
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        module:
          - packages/contracts
          - services/api
          - services/realtime-audio

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - name: Check out target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: Download Go modules
        run: go mod download

      - name: Verify Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'The following Go files are not formatted:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Build Go code
        run: go build ./...

      - name: Test Go code
        run: go test -count=1 -race ./...

  verify-integration:
    name: Verify API Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lingow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lingow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: services/api

    env:
      RECORDSTORE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lingow_test?sslmode=disable
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lingow_test?sslmode=disable
      JWT_SECRET: ci-integration-secret-1234567890123456
      REALTIME_TICKET_SECRET: ci-realtime-ticket-secret-1234567890
      LINGOW_SESSION_RUNTIME: disabled

    steps:
      - name: Check out target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod

      - name: Download Go modules
        run: go mod download

      - name: Run API integration tests
        run: go test -count=1 -tags=integration ./...

  build-backend:
    name: Build Backend Artifacts
    needs:
      - verify-go
      - verify-integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod

      - name: Build backend binaries
        shell: bash
        run: |
          mkdir -p dist

          cd services/api
          go build -trimpath -ldflags "-s -w" -o ../../dist/lingow-api-linux-amd64 .

          cd ../realtime-audio
          go build -trimpath -ldflags "-s -w" -o ../../dist/lingow-realtime-audio-linux-amd64 .

          cd ../..
          sha256sum dist/* > dist/checksums.txt

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifacts-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build-backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-artifacts-${{ github.sha }}
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes
